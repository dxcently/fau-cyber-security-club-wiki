[params]
  # Use the custom hacker terminal theme.
  #
  # Three variants: the dark screen, its daylight twin, and the neon-green
  # "cyber" screen. The FIRST entry is the default for a first-time visitor —
  # keep 'hacker' there, or every new reader lands on a different site than
  # the one this wiki was designed around.
  #
  # The topbar toggle (layouts/partials/topbar/button/variant.html) cycles
  # them in this order and the theme remembers the choice in localStorage.
  # Each identifier needs assets/css/theme-<identifier>.css to exist; a
  # missing file is a build error, not a silent fallback.
  themeVariant = [
    { identifier = 'hacker',       name = 'Dark' },
    { identifier = 'hacker-light', name = 'Light' },
    { identifier = 'cyber',        name = 'Cyber' },
  ]

  # Show the shortcuts menu title
  disableShortcutsTitle = false

  # Report content mistakes at build time instead of failing silently.
  # A link or image that points at a page which does not exist prints a
  # warning naming the source file and the bad target. Warning, not error:
  # the build still completes so you can see every problem in one pass.
  [params.link]
    errorlevel = 'warning'

  [params.image]
    errorlevel = 'warning'

  # Configure sidebar menus
  # Header: search and home button (default)
  # Main: page menu (default)
  # Footer: shortcuts menu with Discord/GitHub links
  [[params.sidebarmenus]]
    type = 'page'
    identifier = 'home'
    main = true
    disableTitle = true
    pageRef = ''

  [[params.sidebarmenus]]
    type = 'menu'
    identifier = 'shortcuts'
    main = false
    disableTitle = false

# Syntax highlighting: emit CSS CLASSES, not inline styles.
#
# Hugo's default (noClasses = true) writes `style="...background-color:#272822"`
# straight into every code block — Monokai, hardcoded, in the HTML. That wins
# over any stylesheet and is blind to the colour variant, so code blocks stayed
# dark in light mode and never used assets/css/chroma-hacker.css at all.
# With classes, the theme's per-variant chroma sheet does the colouring.
[markup]
  [markup.highlight]
    noClasses = false
